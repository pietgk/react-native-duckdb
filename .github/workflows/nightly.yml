name: Nightly

on:
  schedule:
    # Off the hour, because GitHub delays scheduled runs most at the start of an hour.
    - cron: '23 3 * * *'
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - name: Clean build without cache
        run: scripts/build-example.sh ios prebuild
      - name: Rebuild over the previous output
        run: scripts/check-ios-rebuild.sh
      - name: Boot simulator
        run: xcrun simctl bootstatus "iPhone 17" -b
      - name: Build app
        run: scripts/build-example.sh ios build
      - name: Install app
        run: xcrun simctl install booted example/ios/build/Build/Products/Debug-iphonesimulator/DuckDBReference.app
      # Start Metro before the tests, which reuse it. The bundle is then ready for
      # the Maestro flows, instead of being built again during the first flow.
      - name: Start Metro
        working-directory: example
        timeout-minutes: 3
        run: |
          CI=1 nohup npx expo start > metro.log 2>&1 &
          until curl -s -m 2 http://localhost:8081/status | grep -q packager-status:running; do sleep 1; done
      - name: Run all tests, including network tests
        run: scripts/run-device-tests.sh ios network=1
        env:
          MIN_PASSED: 174
      - name: Run Maestro flows
        run: maestro test --test-output-dir maestro-output example/.maestro
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-ios
          path: maestro-output
          if-no-files-found: ignore

  package-install:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: bun node
      - run: bun install --frozen-lockfile
      - name: Boot simulator
        run: xcrun simctl bootstatus "iPhone 17" -b
      - name: Install the packed tarball in a new app
        run: scripts/check-package-install.sh ios
