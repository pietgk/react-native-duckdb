name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: Clean build without cache
        working-directory: example/ios
        run: pod install
      - name: Rebuild over the previous output
        run: scripts/check-ios-rebuild.sh
      - name: Boot simulator
        run: xcrun simctl bootstatus "iPhone 17" -b
      - name: Build app
        working-directory: example/ios
        run: >
          xcodebuild -workspace RNDuckDBExample.xcworkspace -scheme RNDuckDBExample
          -configuration Debug -destination "platform=iOS Simulator,name=iPhone 17"
          -derivedDataPath build build
      - name: Install app
        run: xcrun simctl install booted example/ios/build/Build/Products/Debug-iphonesimulator/RNDuckDBExample.app
      - name: Run all tests, including network tests
        run: scripts/run-device-tests.sh ios network=1
        env:
          MIN_PASSED: 165
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Start Metro
        working-directory: example
        run: nohup npx react-native start > metro.log 2>&1 &
      - name: Run Maestro flows
        run: maestro test --test-output-dir maestro-output example/.maestro
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-ios
          path: maestro-output
          if-no-files-found: ignore
