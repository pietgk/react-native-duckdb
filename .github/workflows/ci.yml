name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: bun node
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! CHANGED="$(git diff --no-renames --name-only "$BASE" "$GITHUB_SHA")"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          elif grep -vE '^docs/|\.md$' <<< "$CHANGED" > /dev/null; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    needs: changes
    # Skip only on a clear answer. A skipped job passes its required check, so a
    # failed changes job must not skip this one.
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: bun node
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: |
            package/DuckDB.xcframework
            package/DuckDB.xcframework.key
          # The same inputs as BUILD_KEY in build-duckdb-ios.sh, which still
          # rebuilds if a restored framework does not match.
          key: duckdb-ios-${{ hashFiles('example/app.json', 'package/RNDuckDB.podspec', 'package/duckdb.json', 'package/scripts/build-duckdb-ios.sh', 'package/scripts/build-openssl-curl.sh', 'package/scripts/configure-extensions.js') }}
      - name: Generate native project
        run: scripts/build-example.sh ios prebuild
      - name: Boot simulator
        run: xcrun simctl bootstatus "iPhone 17" -b
      - name: Build app
        run: scripts/build-example.sh ios build
      - name: Install app
        run: xcrun simctl install booted example/ios/build/Build/Products/Debug-iphonesimulator/DuckDBReference.app
      - name: Run tests
        run: scripts/run-device-tests.sh ios
        env:
          MIN_PASSED: 160
          RESULT_FILE: test-results-ios.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-ios
          path: test-results-ios.json
          if-no-files-found: ignore

  android:
    needs: changes
    # Skip only on a clear answer. A skipped job passes its required check, so a
    # failed changes job must not skip this one.
    if: ${{ !cancelled() && needs.changes.outputs.native != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # Gradle reinstalls the NDK on every run, which gives the compiler a new
      # mtime and makes ccache's default check miss every time.
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: bun java node
      - uses: gradle/actions/setup-gradle@v6
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: android-x86_64
          max-size: 5G
      - uses: actions/cache@v6
        with:
          path: package/vendor
          key: vendor-android-${{ hashFiles('package/scripts/build-openssl-curl.sh') }}
      - run: bun install --frozen-lockfile
      - name: Build app
        run: scripts/build-example.sh android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MIN_PASSED: 160
          RESULT_FILE: test-results-android.json
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          script: |
            adb install example/android/app/build/outputs/apk/debug/app-debug.apk
            scripts/run-device-tests.sh android
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-android
          path: test-results-android.json
          if-no-files-found: ignore
