name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: |
            package/DuckDB.xcframework
            package/DuckDB.xcframework.key
          key: duckdb-ios-${{ hashFiles('example/package.json', 'package/duckdb.json', 'package/scripts/*') }}
      - name: Generate native project
        working-directory: example
        run: npx expo prebuild --platform ios
      - name: Boot simulator
        run: xcrun simctl bootstatus "iPhone 17" -b
      - name: Build app
        working-directory: example/ios
        run: >
          xcodebuild -workspace DuckDBReference.xcworkspace -scheme DuckDBReference
          -configuration Debug -destination "platform=iOS Simulator,name=iPhone 17"
          -derivedDataPath build build
      - name: Install app
        run: xcrun simctl install booted example/ios/build/Build/Products/Debug-iphonesimulator/DuckDBReference.app
      - name: Run tests
        run: scripts/run-device-tests.sh ios
        env:
          MIN_PASSED: 160
          RESULT_FILE: test-results-ios.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-ios
          path: test-results-ios.json
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: android-x86_64
          max-size: 5G
      - uses: actions/cache@v6
        with:
          path: package/vendor
          key: vendor-android-${{ hashFiles('package/scripts/build-openssl-curl.sh') }}
      - run: bun install --frozen-lockfile
      - name: Generate native project
        working-directory: example
        run: npx expo prebuild --platform android --no-install
      - name: Build app
        working-directory: example/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MIN_PASSED: 160
          RESULT_FILE: test-results-android.json
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          script: |
            adb install example/android/app/build/outputs/apk/debug/app-debug.apk
            scripts/run-device-tests.sh android
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-android
          path: test-results-android.json
          if-no-files-found: ignore
