name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@pietgk"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag matches the package version
        working-directory: package
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Build package
        working-directory: package
        run: bun run build

      - name: Pack
        id: pack
        working-directory: package
        run: echo "tarball=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Attest the tarball
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}

      - name: Publish to GitHub Packages
        run: npm publish "$RUNNER_TEMP/${{ steps.pack.outputs.tarball }}" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/${{ steps.pack.outputs.tarball }}
          generate_release_notes: true
