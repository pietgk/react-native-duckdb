appId: dev.pietgk.duckdbreference
tags:
  - network
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Curated"
    timeout: 60000
# Not a trending dataset, because that list changes and can include gated ones.
- tapOn: "Curated"
- tapOn: ".*SWE-bench Verified.*"
- extendedWaitUntil:
    visible: ".*Preview.*"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 20000
- runFlow: ../shared/assert-healthy.yaml
- takeScreenshot: dataset-detail
