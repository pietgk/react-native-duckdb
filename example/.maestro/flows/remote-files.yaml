appId: com.rnduckdbexample
tags:
  - network
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: tab-explorer
    timeout: 20000
- tapOn:
    id: tab-explorer
- tapOn: ".*Remote Files.*"
- extendedWaitUntil:
    visible: ".*Taxi Data.*"
    timeout: 8000
- extendedWaitUntil:
    notVisible: "Loading httpfs extension..."
    timeout: 10000
# Check now: running a query clears an extension load error.
- runFlow: ../shared/assert-healthy.yaml
- tapOn: ".*Taxi Data.*"
- swipe:
    direction: UP
    duration: 500
- extendedWaitUntil:
    visible: ".*Run Query.*"
    timeout: 5000
- tapOn: ".*Run Query.*"
- extendedWaitUntil:
    visible: ".*rows.*"
    timeout: 45000
- runFlow: ../shared/assert-healthy.yaml
- takeScreenshot: remote-files
