appId: dev.pietgk.duckdbreference
tags:
  - network
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: tab-tests
    timeout: 20000
# Keep tapping, because a tap during startup can be lost with no error.
- repeat:
    while:
      notVisible:
        id: run-all
    times: 5
    commands:
      - tapOn:
          id: tab-tests
      - waitForAnimationToEnd:
          timeout: 1200
- tapOn:
    id: run-all
- extendedWaitUntil:
    visible: "Running..."
    timeout: 10000
- extendedWaitUntil:
    notVisible: "Running..."
    timeout: 480000
- assertVisible: "0 failed"
- takeScreenshot: test-suite
